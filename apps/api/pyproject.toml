[project]
name = "get-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.13.0",
  "redis>=5.0.0",
  "arq>=0.26.0",
  "pydantic-settings>=2.3.0",
  "httpx>=0.27.0",
  "yt-dlp>=2025.11.12",
  "faster-whisper>=1.1.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
